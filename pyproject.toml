[project]
name = "recon"
version = "0.1.9"
description = "Security reconnaissance utilities"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "questionary>=2.1.1",
    "typer>=0.27.1",
]

[project.gui-scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.31.3",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.10",
]

[tool.uv]
package = true

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = ["src"]
